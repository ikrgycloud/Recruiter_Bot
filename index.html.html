const KEY='ikrgy.enterprise.frontend.v2';
const deepClone=o=>JSON.parse(JSON.stringify(o));
function loadState(){
  try { const raw=localStorage.getItem(KEY); if(raw) return {...deepClone(seedState),...JSON.parse(raw)}; } catch{}
  return deepClone(seedState);
}
let state=loadState();
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function reset(){state=deepClone(seedState);save();location.hash='#/dashboard';location.reload();}
function setToast(message,tone='success'){state.ui.toast={message,tone,at:Date.now()};save();}
function audit(runId,stage,event,summary,actor='system'){
  state.audits.unshift({id:'AU-'+Math.floor(1000+Math.random()*8999),time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}),runId,stage,event,actor,summary});
  save();
}
function approve(runId){
  const run=state.wf1Runs.find(x=>x.id===runId); const ap=state.approvals.find(x=>x.runId===runId&&x.status==='pending');
  if(!run||!ap) return false;
  ap.status='approved'; run.status='executed';
  audit(runId,'approval','approved','Recruiter approved staged action.',state.session.email);
  audit(runId,'system_action','calendar_patch','Calendar update executed first.');
  audit(runId,'system_action','greenhouse_update','Greenhouse interview record updated second.');
  audit(runId,'system_action','email_send','Candidate confirmation sent last.');
  state.notifications.unshift({id:'NT-'+Date.now(),time:'Now',channel:'Dashboard',title:'Reschedule executed',body:`${run.candidate} was rescheduled to ${run.newTime}.`,read:false});
  state.metrics.pendingApprovals=Math.max(0,state.metrics.pendingApprovals-1); save(); return true;
}
function reject(runId,reason='Recruiter rejected the proposed action.'){
  const run=state.wf1Runs.find(x=>x.id===runId); const ap=state.approvals.find(x=>x.runId===runId&&x.status==='pending');
  if(!run||!ap) return false;
  ap.status='rejected'; run.status='rejected';
  audit(runId,'approval','rejected',reason,state.session.email); state.metrics.pendingApprovals=Math.max(0,state.metrics.pendingApprovals-1); save(); return true;
}
function markAllRead(){state.notifications.forEach(n=>n.read=true);save();}
function updateSettings(patch){Object.assign(state.settings,patch);save();}
function saveCriteria(reqId,criteria){state.criteria[reqId]=criteria;const r=state.requisitions.find(x=>x.id===reqId);if(r)r.criteriaVersion+=1;audit(reqId,'configuration','criteria_updated','Ranking criteria saved by admin.',state.session.email);save();}
function rerunRanking(reqId){const req=state.requisitions.find(x=>x.id===reqId);if(req)req.lastRanked='Now';audit(reqId,'ranking','rerun_requested','Recruiter requested ranking re-run using current criteria.',state.session.email);save();}

 return layout(`<div class="page-actions"><div><span class="eyebrow">Recruiter recommendation only</span><h2 class="inline-title">Active requisitions</h2></div><button class="secondary" data-action="new-ranking">Run ranking</button></div><div class="req-grid">${state.requisitions.map(r=>`<section class="req-card"><div class="req-top"><span class="req-id">${r.id}</span>${badge(r.status)}</div><h3>${esc(r.title)}</h3><p>${esc(r.department)} · ${esc(r.location)}</p><div class="req-stats"><div><strong>${r.applicants}</strong><span>Applicants</span></div><div><strong>v${r.criteriaVersion}</strong><span>Criteria</span></div><div><strong>${r.shortlistSize}</strong><span>Top N</span></div></div><small>Last ranked: ${esc(r.lastRanked)}</small><div class="req-actions"><button class="secondary" data-criteria="${r.id}">Adjust criteria</button><button class="primary" data-ranking="${r.id}">View ranking</button></div></section>`).join('')}</div><section class="card fairness"><div><div class="fairness-icon">⚖</div><div><h3>Explainable, reviewable ranking</h3><p>AI evaluates one candidate at a time against bona fide job criteria. Weighted arithmetic is deterministic in code. Every score carries evidence. The agent never advances or rejects candidates.</p></div></div><button class="secondary" data-action="view-fairness">Review controls</button></section>`, 'Workflow 2 · Candidate Ranking & Recruiter Alert','Configurable per requisition; full ranking visible; recruiter remains the final decision-maker');
}
function rankingModal(reqId){const req=state.requisitions.find(r=>r.id===reqId);const rows=state.rankings[reqId]||[];return `<div class="detail-header"><div><span class="eyebrow">${req.id}</span><h2>${esc(req.title)}</h2><p>${req.applicants} applicants · criteria v${req.criteriaVersion} · Top ${req.shortlistSize}</p></div>${badge('recruiter_decides')}</div><div class="ranking-toolbar"><button class="secondary" data-criteria="${req.id}">Adjust criteria</button><button class="secondary" data-rerun="${req.id}">Re-run ranking</button><button class="danger subtle" data-action="ranking-wrong" data-req="${req.id}">This ranking looks wrong</button></div><div class="ranking-list">${rows.map(c=>`<div class="candidate-row"><div class="rank">${c.rank}</div><div class="candidate-main"><div><b>${esc(c.name)}</b><span class="score">${c.score.toFixed(1)}</span>${badge(c.completeness)}</div><p>${esc(c.summary)}</p><details><summary>Evidence & concerns</summary><div class="evidence"><div><h5>Evidence</h5>${c.evidence.map(x=>`<span>✓ ${esc(x)}</span>`).join('')}</div><div><h5>Concerns</h5>${c.concerns.map(x=>`<span>• ${esc(x)}</span>`).join('')}</div></div></details></div><button class="table-action" data-action="open-greenhouse" data-candidate="${c.id}">Open in Greenhouse ↗</button></div>`).join('')}</div><div class="info-callout">No candidate status is changed by this ranking. Recruiter reviews and decides in Greenhouse.</div>`}
function criteriaModal(reqId){const req=state.requisitions.find(r=>r.id===reqId);const criteria=state.criteria[reqId]||[];return `<div class="detail-header"><div><span class="eyebrow">${req.id}</span><h2>Criteria editor</h2><p>${esc(req.title)} · job-requirements-aligned scoring profile</p></div><span class="version">v${req.criteriaVersion}</span></div><div class="criteria-layout"><section><h3>Job requirements</h3><div class="job-post">This frontend intentionally does not invent the client's actual job-post text. In API mode, render the requisition's Greenhouse job-post requirements here so criteria can be reviewed beside the source requirements.</div></section><section><h3>Weighted criteria</h3><div id="criteriaRows">${criteria.map((c,i)=>`<div class="criterion" data-index="${i}"><div class="criterion-head"><input data-field="label" value="${esc(c.label)}"><div class="weight"><input type="number" min="0" max="100" step="1" data-field="weight" value="${Math.round(c.weight*100)}"><span>%</span></div></div><textarea data-field="description">${esc(c.description)}</textarea><input data-field="scale" value="${esc(c.scale)}"></div>`).join('')}</div><div class="weight-total">Weight total: <b id="weightTotal">${Math.round(criteria.reduce((a,c)=>a+c.weight,0)*100)}%</b> <span id="weightStatus">${Math.abs(criteria.reduce((a,c)=>a+c.weight,0)-1)<.001?'✓ Valid':'Must equal 100%'}</span></div></section></div><div class="modal-actions"><button class="secondary" data-action="close-modal">Cancel</button><button class="primary" data-save-criteria="${req.id}">Save criteria</button></div>`}
function pageIntegrations(){return layout(`<div class="integration-grid">${state.integrations.map(i=>`<section class="integration-card"><div class="integration-title"><span class="integration-logo">${i.name.slice(0,1)}</span><div><h3>${esc(i.name)}</h3><p>${esc(i.type)}</p></div><span class="status-dot ${i.status}"></span></div><div class="integration-body"><span class="mode">${esc(i.mode)}</span><p>${esc(i.detail)}</p></div><div class="integration-actions"><button class="secondary" data-test-integration="${i.id}">Test connection</button><button class="text-btn" data-action="integration-details" data-id="${i.id}">Details</button></div></section>`).join('')}</div><section class="card architecture"><div class="card-head"><div><h3>Adapter boundary</h3><p>Workflow logic remains unchanged when API/Playwright implementations switch.</p></div></div><div class="arch-flow"><div>Workflow</div><span>→</span><div>Integration interface</div><span>→</span><div class="stack"><b>Official API</b><small>Preferred</small></div><span>or</span><div class="stack warn"><b>Playwright</b><small>Controlled fallback</small></div></div></section>`, 'Integrations','API-first architecture with controlled browser-automation fallback');}
function pageAudit(){return layout(`<div class="page-actions"><div class="search"><input id="auditSearch" placeholder="Filter by run, stage, actor or event…"></div><button class="secondary" data-action="export-audit">Export current view</button></div><section class="card"><div class="card-head"><div><h3>Append-only event trail</h3><p>Trigger, reads, AI decisions, guardrails, approvals, actions and notifications</p></div></div><div id="auditRows" class="audit-list">${renderAuditRows(state.audits)}</div></section><div class="grid-3"><section class="card"><h3>Observability</h3><div class="control-list"><div><span>Structured logs</span><b>run_id on every event</b></div><div><span>Retries</span><b>Backoff · transient only</b></div><div><span>Dead letters</span><b>Human notified</b></div></div></section><section class="card"><h3>Idempotency</h3><p class="muted">Replays must never double-book, double-update or double-send. Executed actions are guarded by dedupe keys.</p></section><section class="card"><h3>Playwright circuit breaker</h3><p class="muted">Repeated selector failures stop browser automation and route attention to operators instead of silently continuing.</p></section></div>`, 'Audit & Observability','Complete recruiter-visible story for every workflow run');}
function renderAuditRows(rows){return rows.map(a=>`<div class="audit-row"><span class="audit-time">${esc(a.time)}</span><span class="audit-run">${esc(a.runId)}</span><span class="audit-stage">${esc(a.stage)}</span><div><b>${esc(a.event)}</b><p>${esc(a.summary)}</p></div><span class="actor">${esc(a.actor)}</span></div>`).join('')}
function pageNotifications(){return layout(`<div class="page-actions"><div><h2 class="inline-title">All channels</h2><p class="muted">Email · Slack · Dashboard · Greenhouse</p></div><button class="secondary" data-action="mark-read">Mark all read</button></div><section class="card"><div class="notification-list">${state.notifications.map(n=>`<div class="notification ${n.read?'read':''}"><span class="channel">${esc(n.channel)}</span><div><b>${esc(n.title)}</b><p>${esc(n.body)}</p></div><small>${esc(n.time)}</small>${!n.read?'<span class="unread-dot"></span>':''}</div>`).join('')}</div></section>`, 'Notifications','Operational alerts and recruiter-facing workflow updates');}
function pageSettings(){const admin=state.session.role==='admin';return layout(`${!admin?`<div class="warning-banner">Admin role is required to change automation policy. Switch role in the header to preview administrative controls.</div>`:''}<div class="settings-grid"><section class="card"><div class="card-head"><h3>Workflow 1 automation policy</h3></div><label class="field"><span>Mode</span><select id="automationMode" ${!admin?'disabled':''}><option value="draft_only" ${state.settings.automationMode==='draft_only'?'selected':''}>Draft-only</option><option value="auto_send" ${state.settings.automationMode==='auto_send'?'selected':''}>Auto-send within guardrails</option></select></label><label class="field"><span>Confidence threshold</span><input id="confidenceThreshold" type="range" min="80" max="100" value="${Math.round(state.settings.confidenceThreshold*100)}" ${!admin?'disabled':''}><output id="confidenceOutput">${pct(state.settings.confidenceThreshold)}</output></label><label class="toggle"><input id="singleOnly" type="checkbox" ${state.settings.autoSendSingleInterviewerOnly?'checked':''} ${!admin?'disabled':''}><span></span>Auto-send eligibility limited to single-interviewer cases</label><label class="toggle"><input id="highStake" type="checkbox" ${state.settings.highStakeManual?'checked':''} ${!admin?'disabled':''}><span></span>Final/onsite or high-stakes stages stay manual</label></section><section class="card"><div class="card-head"><h3>Notification channels</h3></div>${[['notifyEmail','Email'],['notifySlack','Slack'],['notifyDashboard','Dashboard'],['notifyGreenhouse','Greenhouse note']].map(([k,l])=>`<label class="toggle"><input type="checkbox" data-setting="${k}" ${state.settings[k]?'checked':''} ${!admin?'disabled':''}><span></span>${l}</label>`).join('')}</section><section class="card"><div class="card-head"><h3>Frontend API boundary</h3></div><label class="field"><span>Backend base URL</span><input id="apiBaseUrl" value="${esc(state.settings.apiBaseUrl)}" ${!admin?'disabled':''}></label><div class="info-callout">No production credentials are embedded in this frontend. OAuth tokens, API keys and secrets belong in the backend/secrets manager.</div></section><section class="card danger-zone"><div class="card-head"><h3>Demo state</h3></div><p>Reset the local frontend state to the client-aligned sample data shipped with this prototype.</p><button class="danger" data-action="reset-demo">Reset demo data</button></section></div>${admin?`<div class="savebar"><span>Changes are persisted locally in this frontend build.</span><button class="primary" data-action="save-settings">Save settings</button></div>`:''}`, 'Admin Settings','Configuration is data-driven; only admins may change automation mode');}
function render(){
 const r=route(); const pages={dashboard:pageDashboard,wf1:pageWF1,approvals:pageApprovals,wf2:pageWF2,integrations:pageIntegrations,audit:pageAudit,notifications:pageNotifications,settings:pageSettings};
 app.innerHTML=(pages[r]||pageDashboard)(); bind();
}
function openModal(html){state.ui.modal={html};save();render()}
function closeModal(){state.ui.modal=null;save();render()}
function bind(){
 document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>location.hash='#/'+b.dataset.nav);
 document.querySelector('[data-action="go-notifications"]')?.addEventListener('click',()=>location.hash='#/notifications');
 const rs=document.querySelector('#roleSelect'); if(rs)rs.onchange=e=>{state.session.role=e.target.value;save();render()};
 document.querySelectorAll('[data-open-run]').forEach(b=>b.onclick=()=>{const r=state.wf1Runs.find(x=>x.id===b.dataset.openRun);openModal(runDetail(r))});
 document.querySelectorAll('[data-open-approval]').forEach(b=>b.onclick=()=>{const r=state.wf1Runs.find(x=>x.id===b.dataset.openApproval); if(r)openModal(runDetail(r)); else openModal(`<h2>Approval context</h2><p>This sample approval references a run not included in the compact demo dataset.</p>`)});
 document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>{if(approve(b.dataset.approve)){state.ui.modal=null;setToast('Approved. Calendar → Greenhouse → candidate email executed in controlled order.');render()}});
 document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>{const reason=prompt('Reason for rejection (stored in audit trail):','Proposed time needs recruiter adjustment.');if(reason!==null&&reject(b.dataset.reject,reason)){state.ui.modal=null;setToast('Proposal rejected and logged.','warn');render()}});
 document.querySelectorAll('[data-ranking]').forEach(b=>b.onclick=()=>openModal(rankingModal(b.dataset.ranking)));
 document.querySelectorAll('[data-criteria]').forEach(b=>b.onclick=()=>openModal(criteriaModal(b.dataset.criteria)));
 document.querySelectorAll('[data-rerun]').forEach(b=>b.onclick=()=>{rerunRanking(b.dataset.rerun);setToast('Ranking re-run requested with current criteria.');openModal(rankingModal(b.dataset.rerun))});
 document.querySelectorAll('[data-test-integration]').forEach(b=>b.onclick=()=>{const i=state.integrations.find(x=>x.id===b.dataset.testIntegration);setToast(`${i.name}: frontend connectivity test simulated. Production connection requires backend credentials.`);});
 document.querySelectorAll('[data-setting]').forEach(c=>c.onchange=e=>{state.settings[e.target.dataset.setting]=e.target.checked;save()});
 document.querySelector('[data-action="mark-read"]')?.addEventListener('click',()=>{markAllRead();setToast('Notifications marked read.');render()});
 document.querySelector('#auditSearch')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();const f=state.audits.filter(a=>Object.values(a).some(v=>String(v).toLowerCase().includes(q)));document.querySelector('#auditRows').innerHTML=renderAuditRows(f)});
 document.querySelector('#confidenceThreshold')?.addEventListener('input',e=>document.querySelector('#confidenceOutput').textContent=e.target.value+'%');
 document.querySelectorAll('[data-save-criteria]').forEach(b=>b.onclick=()=>saveCriteriaFromUI(b.dataset.saveCriteria));
 document.querySelectorAll('[data-select-slot]').forEach(b=>b.onclick=()=>{const r=state.wf1Runs.find(x=>x.id===b.dataset.run);r.newTime=b.dataset.selectSlot;audit(r.id,'approval','alternative_selected',`Recruiter selected alternative slot: ${r.newTime}`,state.session.email);save();openModal(runDetail(r))});
 document.querySelectorAll('[data-action]').forEach(b=>{if(b.dataset.bound)return;b.dataset.bound='1';const a=b.dataset.action;if(a==='close-modal')b.onclick=closeModal;if(a==='reset-demo')b.onclick=()=>{if(confirm('Reset local demo state?'))reset()};if(a==='save-settings')b.onclick=saveSettings;if(a==='simulate-reschedule')b.onclick=simulateRun;if(a==='export-audit')b.onclick=exportAudit;if(a==='request-clarification')b.onclick=()=>{audit(b.dataset.run,'notification','clarification_requested','Recruiter requested clarification from candidate.',state.session.email);state.ui.modal=null;setToast('Clarification request recorded.');render()};if(a==='resolve-exception')b.onclick=()=>{setToast('Manual resolution opened. In production this routes to the recruiter-owned resolution form.');};if(a==='open-greenhouse')b.onclick=()=>setToast('External Greenhouse deep link requires client tenant URL; not invented in this build.','warn');if(a==='ranking-wrong')b.onclick=()=>{const why=prompt('What looks wrong? This feedback is valuable evaluation data.');if(why){audit(b.dataset.req,'feedback','ranking_disputed',why,state.session.email);setToast('Feedback captured in audit trail.')}};if(a==='new-ranking')b.onclick=()=>openModal(`<h2>Run ranking</h2><p>Select an existing active requisition.</p><div class="modal-actions">${state.requisitions.map(r=>`<button class="secondary" data-ranking="${r.id}">${r.id} · ${esc(r.title)}</button>`).join('')}</div>`);if(a==='view-fairness')b.onclick=()=>openModal(`<h2>WF2 fairness & review controls</h2><div class="checks"><div class="pass"><span>✓</span>Criteria derived from bona fide job requirements</div><div class="pass"><span>✓</span>Evidence attached to every score</div><div class="pass"><span>✓</span>Deterministic weighted arithmetic in code</div><div class="pass"><span>✓</span>Known-set evaluation before go-live</div><div class="pass"><span>✓</span>Recruiter final decision; no automatic advancement</div><div class="pass"><span>✓</span>“Ranking looks wrong” feedback path</div></div><div class="info-callout">Jurisdiction-specific AEDT/bias-audit obligations remain a client legal decision and are not assumed by this frontend.</div>`);if(a==='integration-details')b.onclick=()=>{const i=state.integrations.find(x=>x.id===b.dataset.id);openModal(`<h2>${esc(i.name)}</h2><p>${esc(i.detail)}</p><div class="control-list"><div><span>Mode</span><b>${esc(i.mode)}</b></div><div><span>Status</span><b>${statusLabel(i.status)}</b></div></div>`)};if(a==='command')b.onclick=commandMenu});
}
function saveCriteriaFromUI(reqId){const rows=[...document.querySelectorAll('.criterion')];const out=rows.map((r,i)=>({key:(state.criteria[reqId]?.[i]?.key)||`criterion_${i+1}`,label:r.querySelector('[data-field="label"]').value.trim(),weight:Number(r.querySelector('[data-field="weight"]').value)/100,description:r.querySelector('[data-field="description"]').value.trim(),scale:r.querySelector('[data-field="scale"]').value.trim()}));const total=out.reduce((a,c)=>a+c.weight,0);if(Math.abs(total-1)>.001){alert(`Weights must equal 100%. Current total: ${Math.round(total*100)}%`);return}saveCriteria(reqId,out);state.ui.modal=null;setToast('Criteria saved and versioned.');render()}
function saveSettings(){const v=document.querySelector('#automationMode').value;const threshold=Number(document.querySelector('#confidenceThreshold').value)/100;if(v==='auto_send'&&!confirm('Auto-send must only be enabled after measured shadow-mode validation. Continue changing the demo configuration?'))return;updateSettings({automationMode:v,confidenceThreshold:threshold,autoSendSingleInterviewerOnly:document.querySelector('#singleOnly').checked,highStakeManual:document.querySelector('#highStake').checked,apiBaseUrl:document.querySelector('#apiBaseUrl').value.trim()});setToast('Admin settings saved.');render()}
function simulateRun(){const id='RS-'+Math.floor(2500+Math.random()*500);const r={id,candidate:'Demo Candidate',candidateEmail:'candidate@example.test',requisition:'REQ-1042 · Senior Backend Engineer',stage:'Technical Interview',received:'Now',status:'awaiting_approval',confidence:0.96,oldTime:'Wed · 10:00 AM',newTime:'Thu · 3:00 PM',timezone:'America/New_York',interviewers:['interviewer@client.example'],reason:'Synthetic demo request created in-browser to exercise the full approval UI. No external systems were contacted.',alternatives:['Thu · 4:00 PM','Fri · 11:00 AM'],guardrails:[['Interviewer availability',true],['Candidate availability',true],['Time zone resolved',true],['Interview duration preserved',true],['Candidate / requisition / interview identity',true],['Minimum notice period',true],['Hiring window',true]],emailPreview:'Demo confirmation message. Production copy is generated by the configured AI service and constrained by backend policy.'};state.wf1Runs.unshift(r);state.approvals.unshift({id:'AP-'+Date.now(),runId:id,type:'reschedule',title:'Reschedule · Demo Candidate',status:'pending',owner:state.session.name,created:'Now',priority:'normal'});state.metrics.pendingApprovals+=1;audit(id,'trigger','demo_email_received','Synthetic demo run created from frontend.',state.session.email);save();setToast('Demo reschedule run created and staged for approval.');render()}
function exportAudit(){const data=JSON.stringify(state.audits,null,2);const blob=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ikrgy-audit-export.json';a.click();URL.revokeObjectURL(a.href);}
function commandMenu(){openModal(`<div class="command"><h2>Quick navigation</h2>${nav.map(([r,l,i])=>`<button data-nav="${r}">${i}<span>${l}</span></button>`).join('')}</div>`)}
window.addEventListener('hashchange',render);render();

</script>
</body>
</html>
